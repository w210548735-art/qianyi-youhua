[project]
name = "qianyi-youhua"
version = "0.1.0"
description = "黔衣有话：贵州文旅博主 AI 内容资产与运营辅助产品"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.19",
  "pydantic>=2.0",
  "httpx>=0.27",
  "jinja2>=3.1",
  "numpy>=1.26",
  "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=7.0",
  "ruff>=0.8",
  "mypy>=1.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m daily"
markers = [
  "daily: 每次代码修改后运行的代表性快速回归",
  "migration: Alembic 历史升级、降级和漂移门禁；仅在迁移或模型变更时运行",
  "performance: 千条规模与时延门禁；提交前或性能相关改动时运行",
  "real_integration: 真实 BGE/CUDA 或 DeepSeek 集成；必须显式提供环境开关",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["models", "data"]
